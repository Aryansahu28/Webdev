<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Express Buttons</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }

        body{
            background-color: #bb9457;
            color:#f5f3f5;
        }

        .block{
            height: 40vh;
            display: flex;
            flex-direction: column;
            gap:50px;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }
        h1{
            font-size: 50px;
            font-weight: 600;
            text-shadow: 4px -3px black;;
        }

        button{
            border:1px solid transparent;
            width:200px;
            height:50px;
            background-color: #1b264f;
            font-size: 30px;
            color:#99582a;
            border-radius: 30px;
            transition: transform 0.2s;
        }

        button:active{
            transform: scale(0.95);
            box-shadow: 3px 1px 5px #1a3492;;
        }
    </style>
</head>

<body>
    <div class="block">
        <h1>Add data into your MongoDB</h1>
        <button class="add">Add Data</button>
    </div>

    <div class="block">
        <h1>Delete data entirely</h1>
        <button class="delete">Delete All</button>
    </div>
    <script src="scripts.js"></script>
</body>
</html>
